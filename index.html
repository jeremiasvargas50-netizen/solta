<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{ -webkit-tap-highlight-color: transparent; }
  html,body{ font-family:'Inter',system-ui,sans-serif; background:#E5E7EB; }
  .app{
    width:100%; max-width:430px; min-height:100vh; margin:0 auto;
    background:#FAF8F4; box-shadow:0 0 80px rgba(0,0,0,.08);
    position:relative; overflow-x:hidden;
  }
  input[type=range]{
    -webkit-appearance:none; width:100%; height:8px;
    background:#E5E7EB; border-radius:9999px; outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:34px; height:34px; border-radius:50%;
    background:#6366F1; border:4px solid #fff; cursor:pointer;
    box-shadow:0 4px 12px rgba(99,102,241,.4);
  }
  input[type=range]::-moz-range-thumb{
    width:30px; height:30px; border-radius:50%;
    background:#6366F1; border:4px solid #fff; cursor:pointer;
  }
  .scroll-hide::-webkit-scrollbar{ display:none; }
  .screen{ animation:fade .3s ease-out; }
  @keyframes fade{ from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  .breathe{ animation:br 4s ease-in-out infinite; }
  @keyframes br{ 0%,100%{transform:scale(1);opacity:.7} 50%{transform:scale(1.18);opacity:1} }
  .breathe-slow{ animation:brs 7s ease-in-out infinite; }
  @keyframes brs{ 0%,100%{transform:scale(.85);opacity:.5} 50%{transform:scale(1.25);opacity:1} }
  .pulse-soft{ animation:ps 2.4s ease-in-out infinite; }
  @keyframes ps{ 0%,100%{opacity:1} 50%{opacity:.7} }
  .modal-overlay{ animation:fade .2s ease-out; }
  .modal-content{ animation:slideUp .3s ease-out; }
  @keyframes slideUp{ from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }
  /* Accesibilidad global: focus visible solo con teclado */
  button:focus-visible, a:focus-visible, input:focus-visible, [role=button]:focus-visible {
    outline: 3px solid #6366F1; outline-offset: 2px; border-radius: 8px;
  }
  button:focus:not(:focus-visible), a:focus:not(:focus-visible) { outline: none; }
</style>

<body>
<div class="app" id="app"></div>
<div id="modal-root"></div>

<script>
/* ============================================================
   UTILIDADES (escape XSS, validación)
============================================================ */
function esc(v){
  if(v == null) return '';
  return String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
/** @typedef {{date:string,label:string,before:number,after:number,category:string,ancla:string}} Session */
function isValidSession(s){
  return s && typeof s === 'object'
    && typeof s.before === 'number' && typeof s.after === 'number'
    && typeof s.label === 'string' && typeof s.date === 'string';
}

/* ============================================================
   ESTADO + PERSISTENCIA
============================================================ */
const DEFAULTS = {
  screen:'portada',
  acceptedDisclaimer:false,
  category:null,
  formato:null,           // 'imagen' | 'pelicula' | 'sonido' | 'metafora'
  intensityBefore:5,
  intensityAfter:null,
  visual:{ brillo:50, distancia:50, tamanio:50, color:1, asociado:'asociado', movimiento:'estatica' },
  auditivo:{ hay:'si', volumen:50, distancia:50 },
  kinestesico:{ peso:50, intensidad:50, temperatura:50, ubicacion:'pecho' },
  modificaciones:[],
  modIndex:0,             // step actual en transformación
  ancla:'',
  recurso:'',
  paused:false,
  titulo:'',
  sessions:[],
};
// Limpiar versiones viejas del storage (sin datos demo)
try{ localStorage.removeItem('solta_state'); }catch(e){}
let state = JSON.parse(JSON.stringify(DEFAULTS));
try{
  const saved = localStorage.getItem('solta_state_v2');
  if(saved){
    const s = JSON.parse(saved);
    state.acceptedDisclaimer = s.acceptedDisclaimer || false;
    // Validar shape de cada session para evitar corrupción
    state.sessions = Array.isArray(s.sessions) ? s.sessions.filter(isValidSession) : [];
    // Si ya aceptó el disclaimer, saltear portada en próximas visitas
    if(state.acceptedDisclaimer) state.screen = 'home';
  }
}catch(e){}
function saveState(){
  try{
    localStorage.setItem('solta_state_v2', JSON.stringify({
      acceptedDisclaimer: state.acceptedDisclaimer,
      sessions: state.sessions.slice(0,30),
    }));
  }catch(e){}
}
saveState();

const WA = "https://wa.me/5491170599871?text=" + encodeURIComponent(
  "Hola Jere, vengo de la app Soltá y me gustaría reservar una sesión personal."
);
const IG = "https://instagram.com/jeremiasvargascoach";

/* ============================================================
   NAVEGACIÓN + TIMER
============================================================ */
let timer = { startedAt:null };
function startTimer(){ timer.startedAt = Date.now(); }
function tickTimer(){
  if(!timer.startedAt) return '';
  const t = Math.floor((Date.now() - timer.startedAt)/1000);
  return `${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;
}
function go(s){
  if(s === 'sesion-1') startTimer();
  state.screen = s;
  closeModal();
  render();
  window.scrollTo({top:0,behavior:'instant'});
}
function back(){
  const order = ['home','sesion-1','sesion-2a','sesion-2b','sesion-2c','sesion-V','sesion-A','sesion-K','sesion-7','sesion-cierre-respiro','sesion-cierre-medicion'];
  const i = order.indexOf(state.screen);
  if(i > 0) go(order[i-1]);
  else go('home');
}

/* ============================================================
   MODAL DE PAUSA
============================================================ */
function openPauseModal(){
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-overlay fixed inset-0 bg-black/50 z-30 flex items-end sm:items-center justify-center p-0 sm:p-4" onclick="closeModal(event)">
      <div class="modal-content bg-white rounded-t-3xl sm:rounded-3xl max-w-[400px] w-full p-6" onclick="event.stopPropagation()">
        <div class="text-center mb-4">
          <div class="inline-block w-14 h-14 rounded-full bg-ind-100 flex items-center justify-center text-2xl mb-3">⏸</div>
          <h3 class="text-lg font-bold text-ink">¿Necesitás pausar?</h3>
          <p class="text-sm text-stone-600 mt-1">Está bien parar acá. Podés volver cuando quieras y retomar.</p>
        </div>
        <button onclick="closeModal()" class="w-full bg-ind-500 hover:bg-ind-600 text-white py-3.5 rounded-2xl font-semibold mb-2">
          Seguir con la sesión
        </button>
        <button onclick="cancelSession()" class="w-full bg-stone-100 hover:bg-stone-200 text-stone-700 py-3.5 rounded-2xl font-semibold">
          Guardar y volver al inicio
        </button>
      </div>
    </div>
  `;
}
function closeModal(e){
  if(e && e.target !== e.currentTarget) return;
  document.getElementById('modal-root').innerHTML = '';
}
function cancelSession(){
  state.modificaciones=[]; state.intensityAfter=null; state.ancla=''; state.modIndex=0;
  closeModal();
  go('home');
}

/* ============================================================
   COMPONENTES UI
============================================================ */
function Header({title, sub, step, total, showBack=true, showTimer=false, showPause=false}){
  return `
    <div class="px-5 pt-5 pb-3 flex items-center gap-2 sticky top-0 bg-cream/90 backdrop-blur z-10">
      ${showBack ? `<button onclick="back()" class="w-11 h-11 -ml-2 flex items-center justify-center text-2xl text-stone-700 active:scale-90 transition">←</button>` : '<div class="w-9"></div>'}
      <div class="flex-1 text-center min-w-0">
        <div class="text-base font-bold text-ink truncate">${title||''}</div>
        ${sub ? `<div class="text-[11px] text-stone-500">${sub}</div>` : ''}
      </div>
      ${showTimer ? `<div class="text-[11px] text-stone-400 font-mono w-10 text-right" id="timer">${tickTimer()}</div>` : '<div class="w-10"></div>'}
      ${showPause ? `<button onclick="openPauseModal()" class="w-11 h-11 -mr-2 flex items-center justify-center text-stone-500 active:scale-90 transition" title="Pausar">⏸</button>` : ''}
    </div>
    ${step ? `
      <div class="px-5 mb-3">
        <div class="h-1.5 bg-stone-200/70 rounded-full overflow-hidden">
          <div class="h-full bg-gradient-to-r from-ind-500 to-ind-600 rounded-full transition-all duration-500" style="width:${(step/total)*100}%"></div>
        </div>
        <div class="flex justify-between mt-1.5 text-[10px] text-stone-400">
          <span>Paso ${step} de ${total}</span>
          <span>~${Math.max(1, total - step + 1)} min restantes</span>
        </div>
      </div>
    ` : ''}
  `;
}

function DisclaimerFooter(){
  return `
    <div class="px-5 pt-4 pb-6">
      <button onclick="go('aviso')" class="w-full p-3 rounded-xl bg-amb-50 border border-amb-100 text-center">
        <p class="text-[11px] text-stone-700 leading-tight">
          ⚠ Este ejercicio NO reemplaza terapia · <span class="text-ind-600 underline">Leer aviso</span>
        </p>
      </button>
    </div>
  `;
}

/* ============================================================
   PANTALLAS
============================================================ */

function ScreenPortada(){
  return `
    <div class="screen min-h-screen flex flex-col bg-gradient-to-b from-cream via-ind-50 to-mint-50 relative overflow-hidden">
      <!-- Partículas decorativas que flotan -->
      <div class="absolute inset-0 pointer-events-none" aria-hidden="true">
        <div class="absolute top-[12%] left-[15%] w-2 h-2 rounded-full bg-ind-300/60 breathe-slow"></div>
        <div class="absolute top-[20%] right-[20%] w-3 h-3 rounded-full bg-mint-500/40 breathe" style="animation-delay:.8s"></div>
        <div class="absolute top-[30%] left-[70%] w-1.5 h-1.5 rounded-full bg-ind-400/60 breathe" style="animation-delay:1.5s"></div>
        <div class="absolute top-[55%] left-[10%] w-2 h-2 rounded-full bg-mint-500/50 breathe-slow" style="animation-delay:.3s"></div>
        <div class="absolute top-[68%] right-[12%] w-2.5 h-2.5 rounded-full bg-ind-300/50 breathe" style="animation-delay:2s"></div>
      </div>

      <!-- Contenido -->
      <div class="relative z-10 flex-1 flex flex-col items-center justify-center px-6 pt-12 pb-6 text-center">

        <!-- SVG animado: peso → liviandad -->
        <div class="relative w-56 h-56 mb-8">
          <svg viewBox="0 0 200 200" class="w-full h-full">
            <defs>
              <radialGradient id="glow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#A5B4FC" stop-opacity="0.6"/>
                <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
              </radialGradient>
              <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#6366F1"/>
                <stop offset="100%" stop-color="#10B981"/>
              </linearGradient>
            </defs>
            <!-- Halo expansivo -->
            <circle cx="100" cy="100" r="90" fill="url(#glow)" class="breathe-slow" style="transform-origin:100px 100px"/>
            <!-- Anillo medio -->
            <circle cx="100" cy="100" r="70" fill="none" stroke="#6366F1" stroke-opacity="0.2" stroke-width="1.5" class="breathe" style="transform-origin:100px 100px;animation-duration:6s"/>
            <!-- Círculo central -->
            <circle cx="100" cy="100" r="48" fill="url(#circleGrad)" class="breathe" style="transform-origin:100px 100px;animation-duration:5s">
            </circle>
            <!-- Texto S central -->
            <text x="100" y="100" text-anchor="middle" dominant-baseline="central" font-size="56" font-weight="800" fill="white" font-family="Inter, system-ui, sans-serif">S</text>
          </svg>
        </div>

        <!-- Brand -->
        <h1 class="text-5xl font-extrabold text-ink mb-1 tracking-tight">Soltá</h1>
        <p class="text-base text-ind-600 italic mb-2">Soltá lo que te pesa.</p>
        <p class="text-sm text-stone-600 max-w-xs mb-10 leading-relaxed">
          Una app de PNL para transformar emociones, dolor o recuerdos difíciles. <strong class="text-ink">5 minutos</strong> guiados, paso a paso.
        </p>

        <!-- CTAs -->
        <div class="w-full max-w-sm space-y-3">
          <button onclick="acceptAndStart()" class="w-full bg-gradient-to-br from-ind-500 to-ind-600 hover:from-ind-600 hover:to-ind-700 text-white py-4 rounded-2xl font-bold text-base shadow-lg shadow-ind-500/30 active:scale-[.98] transition focus-visible:ring-4 focus-visible:ring-ind-200">
            Empezar ahora →
          </button>
          <div class="grid grid-cols-2 gap-3">
            <button onclick="go('sobre')" class="bg-white/80 backdrop-blur hover:bg-white text-ink py-3 rounded-2xl font-semibold text-sm border border-stone-200 active:scale-95 transition focus-visible:ring-2 focus-visible:ring-ind-500">
              ¿Cómo funciona?
            </button>
            <button onclick="go('aviso')" class="bg-white/80 backdrop-blur hover:bg-white text-ink py-3 rounded-2xl font-semibold text-sm border border-stone-200 active:scale-95 transition focus-visible:ring-2 focus-visible:ring-ind-500">
              Aviso ético
            </button>
          </div>
        </div>
      </div>

      <!-- Footer crisis gate -->
      <div class="relative z-10 px-5 pb-6 pt-2 text-center">
        <p class="text-[11px] text-stone-600 leading-relaxed">
          Si estás en una crisis, llamá al <strong>135</strong> (Argentina, gratis).<br>
          Esta app NO reemplaza terapia ni atención profesional.
        </p>
      </div>
    </div>
  `;
}

// Aceptar disclaimer y arrancar sesión
function acceptAndStart(){
  state.acceptedDisclaimer = true;
  saveState();
  go('sesion-1');
}

function ScreenHome(){
  const last = state.sessions[0];
  // Detectar tema repetido en últimas 5 sesiones
  const recent = state.sessions.slice(0,5);
  const counts = {};
  recent.forEach(s => { counts[s.category] = (counts[s.category]||0)+1; });
  const repeated = Object.entries(counts).find(([k,v]) => v >= 3);

  return `
    <div class="screen pb-32">
      <!-- Brand bar -->
      <div class="px-5 pt-7 pb-2 flex items-center justify-between">
        <div>
          <div class="text-3xl font-extrabold text-ink leading-tight">Soltá</div>
          <div class="text-xs text-ind-600 italic mt-0.5">Soltá lo que te pesa.</div>
        </div>
        <button onclick="go('sobre')" class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center text-stone-600 font-bold active:scale-95" aria-label="Sobre la técnica">i</button>
      </div>

      <!-- HERO simple, solo CTA -->
      <div class="mx-5 mt-4 rounded-3xl bg-gradient-to-br from-ind-500 to-ind-600 p-6 shadow-xl shadow-ind-500/20">
        <button onclick="go('sesion-1')" class="w-full bg-white hover:bg-stone-50 text-ind-600 py-4 rounded-2xl font-bold text-base shadow-lg active:scale-[.98] transition">
          Empezar sesión →
        </button>
      </div>

      <!-- Recall del ancla anterior -->
      ${last && last.ancla ? `
        <div class="mx-5 mt-4 rounded-2xl bg-mint-50 border border-mint-100 p-4">
          <div class="text-xs text-stone-600 uppercase tracking-wide font-semibold">${esc(last.date)}, anclaste</div>
          <div class="flex items-baseline gap-2 mt-1">
            <span class="text-2xl">⚓</span>
            <div class="text-2xl font-extrabold text-mint-700 italic">"${esc(last.ancla)}"</div>
          </div>
          <div class="text-sm text-stone-700 mt-2">¿Cómo estás con eso hoy?</div>
        </div>
      ` : ''}

      <!-- Sugerencia inteligente si tema se repite -->
      ${repeated ? `
        <div class="mx-5 mt-4 rounded-2xl bg-amb-50 border border-amb-100 p-4">
          <div class="text-sm font-semibold text-ink mb-1">★ Notamos algo</div>
          <p class="text-xs text-stone-700 leading-relaxed mb-3">
            Trabajaste <strong>${repeated[0]}</strong> ${repeated[1]} veces últimamente.
            A veces, cuando algo vuelve, ayuda hablarlo en una sesión personal.
          </p>
          <a href="${WA}" target="_blank" class="inline-block bg-mint-500 hover:opacity-90 text-white text-xs font-semibold px-4 py-2 rounded-xl">
            Hablemos por WhatsApp →
          </a>
        </div>
      ` : ''}

      <!-- Última sesión -->
      ${last ? `
        <div class="mx-5 mt-4 rounded-2xl bg-white p-4 border border-stone-100">
          <div class="flex items-center justify-between mb-2">
            <div class="text-xs text-stone-500 uppercase tracking-wide font-semibold">Tu última sesión</div>
            <button onclick="go('diario')" class="text-xs text-ind-600 font-semibold">Ver diario →</button>
          </div>
          <div class="text-sm font-semibold text-ink">${esc(last.label)}</div>
          <div class="text-[11px] text-stone-500 mb-2">${esc(last.date)}${last.category && last.category !== last.label ? ' · ' + esc(last.category) : ''}</div>
          <div class="flex items-center gap-2 mt-3">
            <div class="text-coral-500 text-2xl font-bold w-8">${last.before}</div>
            <div class="flex-1 h-2 bg-stone-200 rounded-full overflow-hidden">
              <div class="h-full bg-gradient-to-r from-coral-500 to-mint-500" style="width:${(last.before-last.after)*10}%"></div>
            </div>
            <div class="text-mint-500 text-2xl font-bold w-8 text-right">${last.after}</div>
          </div>
        </div>
      ` : ''}

      <!-- Sesiones personales con vos -->
      <div class="mx-5 mt-4 rounded-2xl bg-mint-50 border border-mint-100 p-4">
        <div class="flex items-start gap-3">
          <div class="w-12 h-12 rounded-full bg-mint-500 flex items-center justify-center text-white font-bold text-lg flex-shrink-0">J</div>
          <div class="flex-1 min-w-0">
            <div class="text-sm font-semibold text-ink">Sesiones personales con Jere</div>
            <div class="text-xs text-stone-600 mt-0.5">Acompañamiento 1 a 1 cuando lo necesites.</div>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2 mt-3">
          <a href="${WA}" target="_blank" class="bg-mint-500 hover:opacity-90 text-white text-xs font-semibold text-center py-2.5 rounded-xl active:scale-95 transition">WhatsApp →</a>
          <a href="${IG}" target="_blank" class="bg-white hover:bg-stone-50 border border-stone-200 text-stone-700 text-xs font-semibold text-center py-2.5 rounded-xl active:scale-95 transition">Instagram →</a>
        </div>
      </div>

      ${DisclaimerFooter()}
    </div>
  `;
}

function ScreenSesion1(){
  const cats = [
    { id:'Emoción difícil', icon:'❤', sub:'ansiedad, miedo, tristeza, enojo', bg:'bg-coral-100' },
    { id:'Sensación física', icon:'◐', sub:'tensión, opresión, incomodidad', bg:'bg-amb-100' },
    { id:'Recuerdo molesto', icon:'⤺', sub:'algo del pasado que aún duele', bg:'bg-ind-100' },
    { id:'Hábito o impulso', icon:'⤻', sub:'algo que querés dejar de hacer', bg:'bg-mint-100' },
  ];
  return `
    <div class="screen pb-32">
      ${Header({title:'¿Qué te está pesando?', step:1, total:6, showTimer:true, showPause:true})}
      <div class="px-5">
        <div class="bg-white rounded-2xl p-5 mb-4 shadow-sm border border-stone-100">
          <div class="text-sm font-semibold text-ink mb-3">¿Qué tan fuerte lo sentís ahora?</div>
          <div class="flex items-center gap-4">
            <input type="range" min="0" max="10" value="${state.intensityBefore}" oninput="state.intensityBefore=parseInt(this.value); document.getElementById('intDisplay').textContent=this.value">
            <div class="text-4xl font-extrabold text-coral-500 w-12 text-right" id="intDisplay">${state.intensityBefore}</div>
          </div>
          <div class="flex justify-between text-[10px] text-stone-400 mt-2 uppercase">
            <span>nada</span><span>insoportable</span>
          </div>
        </div>

        <div class="text-sm font-semibold text-ink mb-2 px-1">Elegí qué te gustaría transformar hoy:</div>
        <div class="grid grid-cols-2 gap-3 mb-4">
          ${cats.map(c => `
            <button onclick="state.category='${c.id}'; render()" class="${state.category === c.id ? 'ring-4 ring-ind-500 ring-offset-2' : ''} ${c.bg} p-4 rounded-2xl text-left active:scale-95 transition">
              <div class="text-2xl mb-2">${c.icon}</div>
              <div class="text-sm font-bold text-ink">${c.id}</div>
              <div class="text-[11px] text-stone-600 mt-1">${c.sub}</div>
            </button>
          `).join('')}
        </div>

        ${state.category ? `
          <div class="bg-white rounded-2xl p-5 shadow-sm border-2 border-ind-200 mb-4 animate-[fade_.3s_ease-out]">

/* SLIDER REACTIVO con preview visual */
function ReactiveSlider({label, leftHint, rightHint, value, key, modality, preview}){
  return `
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-stone-100">
      <div class="flex items-baseline justify-between mb-3">
        <div class="text-base font-semibold text-ink">${label}</div>
        <div class="text-2xl font-bold text-ind-500" data-display="${modality}-${key}">${value}</div>
      </div>
      <!-- Preview reactivo -->
      <div class="h-12 rounded-xl mb-3 flex items-center justify-center overflow-hidden bg-stone-100" data-preview="${modality}-${key}">
        ${preview(value)}
      </div>
      <input type="range" min="0" max="100" value="${value}"
        oninput="state.${modality}.${key}=parseInt(this.value); document.querySelector('[data-display=&quot;${modality}-${key}&quot;]').textContent=this.value; document.querySelector('[data-preview=&quot;${modality}-${key}&quot;]').innerHTML=PREVIEWS['${modality}-${key}'](parseInt(this.value));">
      <div class="flex justify-between text-[10px] text-stone-400 mt-2 uppercase tracking-wide">
        <span>${leftHint}</span><span>${rightHint}</span>
      </div>
    </div>
  `;
}

/* PREVIEWS reactivos */
const PREVIEWS = {
  'visual-brillo': (v) => `<div class="w-20 h-8 rounded-lg" style="background:rgba(99,102,241,${0.15 + v/120});box-shadow:0 0 ${v/3}px rgba(99,102,241,${v/100})"></div>`,
  'visual-distancia': (v) => {
    const size = 50 - (v/100)*30;
    return `<div class="rounded-lg bg-ind-500/40 transition-all" style="width:${size}px;height:${size*0.6}px"></div>`;
  },
  'visual-tamanio': (v) => {
    const size = 12 + (v/100)*50;
    return `<div class="rounded-lg bg-ind-500/50 transition-all" style="width:${size}px;height:${size*0.6}px"></div>`;
  },
  'auditivo-volumen': (v) => {
    const bars = Math.ceil(v/12);
    let html = '<div class="flex items-end gap-1 h-8">';
    for(let i=0; i<8; i++){
      const h = i < bars ? 8 + (i*3) : 4;
      const op = i < bars ? 1 : 0.2;
      html += `<div class="w-1.5 bg-ind-500 rounded-sm transition-all" style="height:${h}px;opacity:${op}"></div>`;
    }
    html += '</div>';
    return html;
  },
  'auditivo-distancia': (v) => {
    const offset = (v/100)*60 - 30;
    return `<div class="text-2xl transition-all" style="transform:translateX(${offset}px) scale(${1.2 - v/200})">♪</div>`;
  },
  'kinestesico-peso': (v) => {
    const drop = (v/100)*8;
    return `<div class="text-2xl transition-all" style="transform:translateY(${drop}px)">${v < 30 ? '☁' : v < 70 ? '◐' : '⬛'}</div>`;
  },
  'kinestesico-intensidad': (v) => {
    const scale = 0.6 + (v/100)*0.6;
    return `<div class="rounded-full bg-coral-500/60 transition-all" style="width:${24*scale}px;height:${24*scale}px"></div>`;
  },
  'kinestesico-temperatura': (v) => {
    const color = v < 50 ? `rgba(99,170,255,${0.4 + v/120})` : `rgba(248,113,113,${0.4 + (v-50)/100})`;
    return `<div class="w-20 h-8 rounded-lg transition-all" style="background:${color}"></div>`;
  },
};

function aplicarMod(mod){
  if(!state.modificaciones.includes(mod)) state.modificaciones.push(mod);
  saltarMod();
}
function saltarMod(){
  state.modIndex++;
  if(state.modIndex >= SUGGESTIONS.length){
    go('sesion-cierre-respiro');
  } else {
    render();
  }
}

  const auto = Math.max(1, state.intensityBefore - Math.min(state.intensityBefore-1, state.modificaciones.length + 1));
  const after = state.intensityAfter ?? auto;
  const delta = state.intensityBefore - after;
  const elapsed = tickTimer();
  return `
    <div class="screen pb-32">
      ${Header({title:'Tu sesión', showBack:false})}
      <div class="px-5">
        <div class="text-center mb-5">
          <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-mint-500 mb-3">
            <span class="text-white text-2xl">✓</span>
          </div>
          <h2 class="text-xl font-extrabold text-ink">Hiciste un trabajo bonito</h2>
          ${state.ancla ? `<p class="text-sm text-mint-700 mt-1 italic">⚓ Anclaste "${esc(state.ancla)}"</p>` : ''}
          ${elapsed ? `<div class="inline-block mt-2 text-[11px] text-ind-600 font-semibold bg-ind-50 px-3 py-1 rounded-full">⏱ ${elapsed} en total</div>` : ''}
        </div>

        <div class="bg-white rounded-2xl p-5 shadow-sm border border-stone-100 mb-4">
          <div class="text-sm font-semibold text-ink mb-3">¿Qué tan fuerte lo sentís ahora?</div>
          <div class="flex items-center gap-4">
            <input type="range" min="0" max="10" value="${after}" oninput="state.intensityAfter=parseInt(this.value); document.getElementById('aDisplay').textContent=this.value; document.getElementById('dText').textContent='Bajaste '+(${state.intensityBefore}-parseInt(this.value))+' puntos'; document.getElementById('barFill').style.width=((${state.intensityBefore}-parseInt(this.value))*10)+'%'">
            <div class="text-4xl font-extrabold text-mint-500 w-12 text-right" id="aDisplay">${after}</div>
          </div>

          <div class="grid grid-cols-2 gap-3 mt-5 pt-4 border-t border-stone-100">
            <div class="text-center">
              <div class="text-[10px] text-stone-500 uppercase tracking-wider">Antes</div>
              <div class="text-4xl font-extrabold text-coral-500">${state.intensityBefore}</div>
            </div>
            <div class="text-center">
              <div class="text-[10px] text-stone-500 uppercase tracking-wider">Ahora</div>
              <div class="text-4xl font-extrabold text-mint-500">${after}</div>
            </div>
          </div>
          <div class="mt-3 h-2 bg-stone-200 rounded-full overflow-hidden">
            <div class="h-full bg-gradient-to-r from-coral-500 to-mint-500" id="barFill" style="width:${delta*10}%"></div>
          </div>
          <div class="text-center text-sm text-mint-700 font-bold mt-2" id="dText">Bajaste ${delta} puntos</div>
        </div>

        ${shouldShowDeepCTA() ? `
          <div class="bg-mint-50 rounded-2xl p-4 mb-4 border border-mint-100">
            <div class="flex items-start gap-3 mb-3">
              <div class="w-10 h-10 rounded-full bg-mint-500 flex items-center justify-center text-white font-bold flex-shrink-0">J</div>
              <div class="flex-1">
                <div class="text-sm font-semibold text-ink">¿Querés profundizar?</div>
                <div class="text-xs text-stone-600 mt-0.5">En una sesión personal trabajamos más a fondo lo que apareció.</div>
              </div>
            </div>
            <a href="${WA}" target="_blank" class="block bg-mint-500 hover:opacity-90 text-white text-sm text-center font-semibold py-3 rounded-xl active:scale-[.98] transition">
              WhatsApp con Jere →
            </a>
          </div>
        ` : ''}

        <button onclick="finishSession()" class="w-full bg-ind-500 hover:bg-ind-600 text-white py-4 rounded-2xl font-semibold shadow-lg active:scale-[.98] transition">
          Guardar y volver al inicio
        </button>
      </div>
      ${DisclaimerFooter()}
    </div>
  `;
}

/* CTA de WhatsApp aparece solo a partir de la 3ra sesión, no en cada cierre */
function shouldShowDeepCTA(){
  return state.sessions.length >= 2;
}

function finishSession(){
  const after = state.intensityAfter ?? Math.max(1, state.intensityBefore - 4);
  const today = new Date().toLocaleDateString('es-AR', { weekday:'short', day:'numeric' });
  state.sessions.unshift({
    date: 'Hoy ('+today+')',
    label: (state.titulo || '').trim() || state.category || 'Sesión',
    before: state.intensityBefore,
    after: after,
    category: state.category || 'Otro',
    ancla: state.ancla || '',
  });
  // Resetear estado de sesión
  state.modificaciones = [];
  state.intensityAfter = null;
  state.modIndex = 0;
  state.ancla = '';
  state.formato = null;
  state.titulo = '';
  state.category = null;
  state.intensityBefore = 5;
  // Resetear sliders al centro para próxima sesión
  state.visual = { brillo:50, distancia:50, tamanio:50, color:1, asociado:'asociado', movimiento:'estatica' };
  state.auditivo = { hay:'si', volumen:50, distancia:50 };
  state.kinestesico = { peso:50, intensidad:50, temperatura:50, ubicacion:'pecho' };
  saveState();
  go('home');
}

// Borrar todo el historial
function clearHistory(){
  if(!confirm('¿Borrar todo tu historial de sesiones? Esta acción no se puede deshacer.')) return;
  state.sessions = [];
  saveState();
  render();
}

function ScreenDiario(){
  const ss = state.sessions;
  const points = ss.slice().reverse().map((s,i,a) => ({
    x: 20 + (i * (260 / Math.max(1, a.length-1))),
    y: 90 - s.after * 7,
  }));
  const avgDelta = ss.length ? (ss.reduce((acc,s)=>acc+(s.before-s.after),0) / ss.length).toFixed(1) : '0';
  // Tendencia real: comparar promedio primera mitad vs segunda mitad
  let trendText = '';
  if(ss.length >= 4){
    const half = Math.floor(ss.length/2);
    const recent = ss.slice(0,half);
    const older = ss.slice(half);
    const recentAvg = recent.reduce((a,s)=>a+s.after,0)/recent.length;
    const olderAvg = older.reduce((a,s)=>a+s.after,0)/older.length;
    if(recentAvg < olderAvg - 0.5) trendText = '↓ tendencia descendente';
    else if(recentAvg > olderAvg + 0.5) trendText = '↑ tendencia creciente';
    else trendText = '→ tendencia estable';
  }
  return `
    <div class="screen pb-32">
      <div class="px-5 pt-7 pb-2 flex items-center justify-between">
        <div>
          <div class="text-2xl font-extrabold text-ink">Tu diario</div>
          <div class="text-xs text-stone-500">Tu progreso emocional</div>
        </div>
        <button onclick="go('home')" class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center text-stone-600 active:scale-95">×</button>
      </div>

      ${ss.length === 0 ? `
        <div class="mx-5 mt-6 bg-white rounded-2xl p-8 text-center shadow-sm border border-stone-100">
          <div class="inline-block w-16 h-16 rounded-full bg-ind-50 flex items-center justify-center text-3xl mb-3">✦</div>
          <h3 class="text-lg font-bold text-ink mb-2">Tu diario está esperando</h3>
          <p class="text-sm text-stone-600 leading-relaxed mb-5">
            Cuando hagas tu primera sesión vas a empezar a ver tu progreso emocional acá.
          </p>
          <button onclick="go('sesion-1')" class="bg-ind-500 hover:bg-ind-600 text-white px-5 py-3 rounded-2xl font-semibold text-sm shadow-md active:scale-[.98] transition">
            Hacer mi primera sesión →
          </button>
        </div>
      ` : `
        <div class="mx-5 mt-4 bg-white rounded-2xl p-5 shadow-sm border border-stone-100">
          <div class="text-sm font-semibold text-ink mb-1">Intensidad después de cada sesión</div>
          ${trendText ? `<div class="text-xs text-mint-700 font-semibold mb-3">${trendText}</div>` : '<div class="text-xs text-stone-400 mb-3">${ss.length} sesi'+(ss.length===1?'ón':'ones')+'</div>'}
          ${ss.length >= 2 ? `
            <svg viewBox="0 0 300 110" class="w-full h-28">
              <defs>
                <linearGradient id="grad" x1="0" x2="0" y1="0" y2="1">
                  <stop offset="0%" stop-color="#6366F1" stop-opacity="0.3"/>
                  <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
                </linearGradient>
              </defs>
              <path d="M ${points[0].x} 100 ${points.map(p=>`L ${p.x} ${p.y}`).join(' ')} L ${points[points.length-1].x} 100 Z" fill="url(#grad)"/>
              ${points.map((p,i) => i>0 ? `<line x1="${points[i-1].x}" y1="${points[i-1].y}" x2="${p.x}" y2="${p.y}" stroke="#6366F1" stroke-width="2.5"/>` : '').join('')}
              ${points.map(p => `<circle cx="${p.x}" cy="${p.y}" r="5" fill="#6366F1" stroke="white" stroke-width="2"/>`).join('')}
            </svg>
          ` : `
            <p class="text-sm text-stone-500 py-6 text-center">Hacé una sesión más para ver tu gráfico de tendencia.</p>
          `}
          <div class="grid grid-cols-2 gap-2 mt-3 pt-3 border-t border-stone-100">
            <div class="text-center"><div class="text-2xl font-extrabold text-ink">${ss.length}</div><div class="text-[10px] text-stone-600 uppercase">sesi${ss.length===1?'ón':'ones'}</div></div>
            <div class="text-center"><div class="text-2xl font-extrabold text-mint-500">${avgDelta}</div><div class="text-[10px] text-stone-600 uppercase">alivio promedio</div></div>
          </div>
        </div>

        <div class="mx-5 mt-4">
          <div class="flex items-center justify-between mb-3 px-1">
            <div class="text-sm font-semibold text-ink">Sesiones recientes</div>
            <button onclick="clearHistory()" class="text-[11px] text-coral-500 hover:text-coral-700 font-medium underline">
              Borrar historial
            </button>
          </div>
          <div class="space-y-2">
            ${ss.map(s => `
              <div class="bg-white rounded-2xl p-4 border border-stone-100">
                <div class="flex items-start justify-between mb-1">
                  <div class="font-semibold text-sm text-ink">${esc(s.label)}</div>
                  <span class="text-[10px] bg-ind-100 text-ind-700 px-2 py-0.5 rounded-full font-medium">${esc(s.category)}</span>
                </div>
                <div class="text-[11px] text-stone-500">${esc(s.date)}${s.ancla ? ' &bull; ' + esc(s.ancla) : ''}</div>
                <div class="flex items-center gap-2 mt-2.5">
                  <span class="text-coral-500 font-bold">${s.before}</span>
                  <div class="flex-1 h-1.5 bg-stone-200 rounded-full overflow-hidden">
                    <div class="h-full bg-gradient-to-r from-coral-500 to-mint-500" style="width:${(s.before-s.after)*10}%"></div>
                  </div>
                  <span class="text-mint-500 font-bold">${s.after}</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `}
      ${DisclaimerFooter()}
    </div>
  `;
}

      <div class="px-5">

            Escribime por WhatsApp
          </a>
        </div>
      </div>
      ${DisclaimerFooter()}

  `;

function ScreenAviso(){
  return `
    <div class="screen pb-12">
      ${Header({title:'Aviso importante'})}
      <div class="px-5">
        <div class="bg-amb-50 border border-amb-100 rounded-2xl p-5">
          <div class="text-3xl mb-2">⚠</div>

function render(){
  const map = {
    portada: ScreenPortada,
    home: ScreenHome,
    'sesion-1': ScreenSesion1,
    'sesion-2a': ScreenSesion2a,
    'sesion-2b': ScreenSesion2b,
    'sesion-2c': ScreenSesion2c,
    'sesion-V': ScreenSesionV,
    'sesion-A': ScreenSesionA,
    'sesion-K': ScreenSesionK,
    'sesion-7': ScreenSesion7,
    'sesion-cierre-respiro': ScreenCierreRespiro,
    'sesion-cierre-medicion': ScreenCierreMedicion,
    diario: ScreenDiario,
    sobre: ScreenSobre,
    aviso: ScreenAviso,
  };
  document.getElementById('app').innerHTML = (map[state.screen] || ScreenPortada)();
  if(!state.screen.startsWith('sesion-')){
    if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
  } else {
    startTimerTick();
  }
}

let timerInterval = null;
function startTimerTick(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(function(){
    var el = document.getElementById('timer');
    if(el) el.textContent = tickTimer();
  }, 1000);
}

// Service Worker (PWA)
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(err){
      console.warn('SW registration failed:', err);
    });
  });
}

render();
</script>
