<script>
/* ============================================================
   TEMA (claro / oscuro / sepia) — persistente en localStorage
============================================================ */
function applyTheme(theme){
  const valid = ['light','dark','sepia'];
  if(!valid.includes(theme)) theme = 'light';
  document.documentElement.setAttribute('data-theme', theme);
  try{ localStorage.setItem('solta_theme', theme); }catch(e){}
}
function getTheme(){
  try{ return localStorage.getItem('solta_theme') || 'light'; }catch(e){ return 'light'; }
}
applyTheme(getTheme());

/* ============================================================
   REPRODUCTOR 432Hz — Progresión de acordes ambient
============================================================ */
const Audio432 = (function(){
  let ctx = null, master = null, lp = null, reverb = null;
  let playing = false;
  let volume = 0.3;
  let chordTimer = null;
  let chordIndex = 0;

  // Afinación A=432 Hz: freq de cada nota (semitonos desde A4)
  const A432 = 432;
  const f = (semis) => A432 * Math.pow(2, semis / 12);

  // Progresión ambient: Am — F — C — G (vi-IV-I-V), inversiones suaves
  // Cada nota como semitonos desde A4 (A=0)
  const chords = [
    { name:'Am',  notes: [-12, -9,  0,  3,  7] },   // A2, C3, A3, C4, E4
    { name:'F',   notes: [-16, -12, -4,  0,  3] },  // F2, A2, F3, A3, C4
    { name:'C',   notes: [-9,  -5,  0,  3,  7] },   // C3, E3, A3, C4, E4 (with C as root)
    { name:'G',   notes: [-14, -10, -2,  2,  5] },  // G2, B2, G3, B3, D4
  ];

  function makeReverb(){
    // Convolver simple con impulse generado: reverb suave
    const len = ctx.sampleRate * 2.5;
    const ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for(let ch=0; ch<2; ch++){
      const data = ir.getChannelData(ch);
      for(let i=0; i<len; i++){
        data[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 2.5);
      }
    }
    const conv = ctx.createConvolver();
    conv.buffer = ir;
    return conv;
  }

  function ensureCtx(){
    if(ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    ctx = new AC();
    // Si el contexto se suspende mid-session (política autoplay), reactivarlo
    ctx.onstatechange = function(){
      if(ctx.state === 'suspended' && playing) ctx.resume();
    };
    master = ctx.createGain();
    master.gain.value = volume;
    lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 1800;
    lp.Q.value = 0.5;
    reverb = makeReverb();
    const wet = ctx.createGain(); wet.gain.value = 0.5;
    const dry = ctx.createGain(); dry.gain.value = 0.7;
    master.connect(lp);
    lp.connect(dry).connect(ctx.destination);
    lp.connect(reverb).connect(wet).connect(ctx.destination);
  }

  function playChord(chord, duration){
    if(!ctx) return;
    const now = ctx.currentTime;
    const numNotes = chord.notes.length;
    chord.notes.forEach((semi, i) => {
      // Voz principal (sine)
      const freq = f(semi);
      const osc1 = ctx.createOscillator();
      osc1.type = 'sine';
      osc1.frequency.value = freq;
      // Voz armónica (triangle, una octava arriba con menos volumen)
      const osc2 = ctx.createOscillator();
      osc2.type = 'triangle';
      osc2.frequency.value = freq * 2;
      // Detune sutil para vida (8-9 cents)
      const osc3 = ctx.createOscillator();
      osc3.type = 'sine';
      osc3.frequency.value = freq;
      osc3.detune.value = 6;

      const g = ctx.createGain();
      g.gain.value = 0;
      // Envolvente ADSR ambient: attack 2s, sustain duration-3, release 1s
      const peak = 0.18 / numNotes;
      const attack = 1.5;
      const release = 1.5;
      g.gain.setValueAtTime(0, now);
      g.gain.linearRampToValueAtTime(peak, now + attack);
      g.gain.setValueAtTime(peak, now + duration - release);
      g.gain.linearRampToValueAtTime(0, now + duration);

      const g2 = ctx.createGain(); g2.gain.value = 0.25;
      osc2.connect(g2).connect(g);
      osc1.connect(g);
      osc3.connect(g);
      g.connect(master);

      const startT = now;
      const stopT = now + duration + 0.3;
      osc1.start(startT); osc1.stop(stopT);
      osc2.start(startT); osc2.stop(stopT);
      osc3.start(startT); osc3.stop(stopT);
    });
  }

  function progressLoop(){
    if(!playing) return;
    const chord = chords[chordIndex % chords.length];
    const dur = 8;
    playChord(chord, dur);
    chordIndex++;
    chordTimer = setTimeout(progressLoop, 6500); // overlap de ~1.5s entre acordes
  }

  function start(){
    ensureCtx();
    if(!ctx || playing) return;
    if(ctx.state === 'suspended') ctx.resume();
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setValueAtTime(0, ctx.currentTime);
    master.gain.linearRampToValueAtTime(volume, ctx.currentTime + 1.5);
    playing = true;
    chordIndex = 0;
    progressLoop();
  }

  function stop(){
    if(!ctx || !playing) return;
    playing = false;
    if(chordTimer){ clearTimeout(chordTimer); chordTimer = null; }
    const t = ctx.currentTime;
    master.gain.cancelScheduledValues(t);
    master.gain.setValueAtTime(master.gain.value, t);
    master.gain.linearRampToValueAtTime(0, t + 1);
    setTimeout(() => {
      if(master) master.gain.value = volume;
    }, 1100);
  }

  function setVolume(v){
    volume = Math.max(0, Math.min(1, v));
    if(master && playing){
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.linearRampToValueAtTime(volume, ctx.currentTime + 0.15);
    } else if(master){
      master.gain.value = volume;
    }
  }

  return {
    toggle(){ if(playing) stop(); else start(); window._renderAudioPlayer && window._renderAudioPlayer(); },
    setVolume,
    isPlaying(){ return playing; },
    getVolume(){ return volume; },
    resumeIfSuspended(){ if(ctx && ctx.state === 'suspended') ctx.resume(); },
  };
})();

function toggleAudio(){ Audio432.toggle(); }
function changeVolume(v){ Audio432.setVolume(parseFloat(v)/100); }

function AudioPlayerWidget(){
  if(!state.screen.startsWith('sesion-')) return '';
  const playing = Audio432.isPlaying();
  const vol = Math.round(Audio432.getVolume()*100);
  return `
    <div class="audio-player" role="region" aria-label="Reproductor de música 432Hz">
      <button onclick="toggleAudio()" aria-label="${playing?'Pausar':'Reproducir'} música 432Hz" class="w-9 h-9 rounded-full bg-ind-500 text-white flex items-center justify-center text-sm shadow active:scale-95 transition flex-shrink-0">
        ${playing ? '❚❚' : '▶'}
      </button>
      <div class="flex-1 min-w-0 text-[10px]">
        <div class="font-semibold" style="color:var(--ink)">432 Hz</div>
        <div style="color:var(--muted)">música relajante</div>
      </div>
      <input type="range" min="0" max="100" value="${vol}" oninput="changeVolume(this.value)" aria-label="Volumen" style="width:90px;">
    </div>
  `;
}
window._renderAudioPlayer = function(){
  const root = document.getElementById('audio-root');
  if(root) root.innerHTML = AudioPlayerWidget();
};

/* ============================================================
   UTILIDADES (escape XSS, validación)
============================================================ */
function esc(v){
  if(v == null) return '';
  return String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
/** @typedef {{date:string,label:string,before:number,after:number,category:string,ancla:string}} Session */
function isValidSession(s){
  return s && typeof s === 'object'
    && typeof s.before === 'number' && typeof s.after === 'number'
    && typeof s.label === 'string' && typeof s.date === 'string';
}

/* ============================================================
   ESTADO + PERSISTENCIA
============================================================ */
const DEFAULTS = {
  screen:'portada',
  acceptedDisclaimer:false,
  category:null,
  formato:null,           // 'imagen' | 'pelicula' | 'sonido' | 'metafora'
  intensityBefore:5,
  intensityAfter:null,
  visual:{ brillo:50, distancia:50, tamanio:50, color:null, asociado:null, movimiento:null, foco:null, ubicacion:null, marco:null, velocidad:null },
  auditivo:{ hay:'si', volumen:50, distancia:50, tono:null, ritmo:null, voz:null, velocidad:null, ubicacion:null, timbre:null },
  kinestesico:{ peso:50, intensidad:50, temperatura:50, ubicacion:'pecho', textura:null, movimiento:null, ritmo:null, tension:null, profundidad:null },
  modificaciones:[],
  modIndex:0,             // step actual en transformación
  ancla:'',
  recurso:'',
  paused:false,
  titulo:'',
  draft:null,
  prevScreen:null,  // pantalla anterior a sobre/aviso
  musicChoice:null, // 'yes' | 'no' | null
  habitoContexto: null,
  habitoDisparador: '',
  showAdvanced: false,
  showAdvancedA: false,
  showAdvancedK: false,
  sessions:[],
};
// Limpiar versiones viejas del storage (sin datos demo)
try{ localStorage.removeItem('solta_state'); }catch(e){}
let state = JSON.parse(JSON.stringify(DEFAULTS));
try{
  const saved = localStorage.getItem('solta_state_v2');
  if(saved){
    const s = JSON.parse(saved);
    state.acceptedDisclaimer = s.acceptedDisclaimer || false;
    state.sessions = Array.isArray(s.sessions) ? s.sessions.filter(isValidSession) : [];
    state.draft = s.draft && typeof s.draft === 'object' ? s.draft : null;
    state.musicChoice = s.musicChoice || null;
  }
}catch(e){}
function saveState(){
  try{
    localStorage.setItem('solta_state_v2', JSON.stringify({
      acceptedDisclaimer: state.acceptedDisclaimer,
      sessions: state.sessions.slice(0,30),
      draft: state.draft,
      musicChoice: state.musicChoice,
    }));
  }catch(e){}
}
saveState();

const WA = "https://wa.me/5491170599871?text=" + encodeURIComponent(
  "Hola Jere, vengo de la app Soltá y me gustaría reservar una sesión personal."
);
const IG = "https://instagram.com/jeremiasvargascoach";

/* ============================================================
   NAVEGACIÓN + TIMER
============================================================ */
let timer = { startedAt:null, accumulated:0, pausedAt:null };
function startTimer(){
  timer.startedAt = Date.now();
  timer.accumulated = 0;
  timer.pausedAt = null;
}
function pauseTimer(){
  if(timer.startedAt && !timer.pausedAt){
    timer.accumulated += Date.now() - timer.startedAt;
    timer.pausedAt = Date.now();
  }
}
function resumeTimerTab(){
  if(timer.pausedAt){
    timer.startedAt = Date.now();
    timer.pausedAt = null;
  }
}
function tickTimer(){
  if(!timer.startedAt && !timer.accumulated) return '';
  const base = timer.accumulated || 0;
  const running = timer.pausedAt ? 0 : (Date.now() - (timer.startedAt || Date.now()));
  const t = Math.floor((base + running)/1000);
  return `${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;
}
document.addEventListener('visibilitychange', function(){
  if(document.hidden) pauseTimer(); else resumeTimerTab();
});
function go(s){
  if(s === 'sesion-2a') startTimer();
  if(s === 'sobre' || s === 'aviso') state.prevScreen = state.screen;
  state.screen = s;
  closeModal();
  render();
  window.scrollTo({top:0,behavior:'instant'});
}
function back(){
  if((state.screen === 'sobre' || state.screen === 'aviso') && state.prevScreen){
    const dest = state.prevScreen;
    state.prevScreen = null;
    go(dest);
    return;
  }
  const order = ['home','sesion-1','sesion-2a','sesion-2b','sesion-2c','sesion-habito','sesion-V','sesion-A','sesion-K','sesion-7','sesion-reintegracion','sesion-cierre-respiro','sesion-cierre-medicion'];
  const i = order.indexOf(state.screen);
  if(i > 0) go(order[i-1]);
  else go('home');
}

/* ============================================================
   MODAL DE PAUSA

function openPauseModal(){
  document.getElementById('modal-root').innerHTML = `
    <div class="modal-overlay fixed inset-0 bg-black/50 z-30 flex items-end sm:items-center justify-center p-0 sm:p-4" onclick="closeModal(event)">
      <div class="modal-content bg-white rounded-t-3xl sm:rounded-3xl max-w-[400px] w-full p-6" onclick="event.stopPropagation()">
        <div class="text-center mb-4">
          <div class="inline-block w-14 h-14 rounded-full bg-ind-100 flex items-center justify-center text-2xl mb-3">⏸</div>
          <h3 class="text-lg font-bold text-ink">¿Necesitás parar?</h3>
          <p class="text-sm text-stone-600 mt-1">Está bien. Elegí cómo querés salir.</p>
        </div>

function closeModal(e){
  if(e && e.target !== e.currentTarget) return;
  document.getElementById('modal-root').innerHTML = '';
}
// Guardar borrador para retomar después
function pauseAndExit(){
  state.draft = {
    screen: state.screen, category: state.category, titulo: state.titulo,
    formato: state.formato, intensityBefore: state.intensityBefore,
    visual: state.visual, auditivo: state.auditivo, kinestesico: state.kinestesico,
    modificaciones: state.modificaciones, modIndex: state.modIndex, ancla: state.ancla,
    musicChoice: state.musicChoice, savedAt: Date.now(),
  };
  saveState();
  closeModal();
  go('home');
}
// Descartar todo sin guardar
function discardSession(){
  state.modificaciones=[]; state.intensityAfter=null; state.ancla=''; state.modIndex=0;
  state.titulo=''; state.category=null; state.formato=null;
  state.habitoContexto=null; state.habitoDisparador='';
  state.showAdvanced=false; state.showAdvancedA=false; state.showAdvancedK=false;
  state.draft = null;
  saveState();
  closeModal();
  go('home');
}
// Mantener compatibilidad con código viejo que llamaba cancelSession
function cancelSession(){ discardSession(); }
// Retomar borrador
function resumeDraft(){
  if(!state.draft) return;
  Object.assign(state, state.draft);
  state.draft = null;
  saveState();
  go(state.screen);
}

/* SLIDER REACTIVO con preview visual */
function ReactiveSlider({label, leftHint, rightHint, value, key, modality, preview}){
  return `
    <div class="bg-white rounded-2xl p-4 shadow-sm border border-stone-100">
      <div class="flex items-baseline justify-between mb-3">
        <div class="text-base font-semibold text-ink">${label}</div>
        <div class="text-2xl font-bold text-ind-500" data-display="${modality}-${key}">${value}</div>
      </div>
      <!-- Preview reactivo -->
      <div class="h-12 rounded-xl mb-3 flex items-center justify-center overflow-hidden bg-stone-100" data-preview="${modality}-${key}">
        ${preview(value)}
      </div>
      <input type="range" min="0" max="100" value="${value}"
        oninput="state.${modality}.${key}=parseInt(this.value); document.querySelector('[data-display=&quot;${modality}-${key}&quot;]').textContent=this.value; document.querySelector('[data-preview=&quot;${modality}-${key}&quot;]').innerHTML=PREVIEWS['${modality}-${key}'](parseInt(this.value));">
      <div class="flex justify-between text-[10px] text-stone-400 mt-2 uppercase tracking-wide">
        <span>${leftHint}</span><span>${rightHint}</span>
      </div>
    </div>
  `;
}

/* PREVIEWS reactivos */
const PREVIEWS = {
  'visual-brillo': (v) => `<div class="w-20 h-8 rounded-lg" style="background:rgba(99,102,241,${0.15 + v/120});box-shadow:0 0 ${v/3}px rgba(99,102,241,${v/100})"></div>`,
  'visual-distancia': (v) => {
    const size = 50 - (v/100)*30;
    return `<div class="rounded-lg bg-ind-500/40 transition-all" style="width:${size}px;height:${size*0.6}px"></div>`;
  },
  'visual-tamanio': (v) => {
    const size = 12 + (v/100)*50;
    return `<div class="rounded-lg bg-ind-500/50 transition-all" style="width:${size}px;height:${size*0.6}px"></div>`;
  },
  'auditivo-volumen': (v) => {
    const bars = Math.ceil(v/12);
    let html = '<div class="flex items-end gap-1 h-8">';
    for(let i=0; i<8; i++){
      const h = i < bars ? 8 + (i*3) : 4;
      const op = i < bars ? 1 : 0.2;
      html += `<div class="w-1.5 bg-ind-500 rounded-sm transition-all" style="height:${h}px;opacity:${op}"></div>`;
    }
    html += '</div>';
    return html;
  },
  'auditivo-distancia': (v) => {
    const offset = (v/100)*60 - 30;
    return `<div class="text-2xl transition-all" style="transform:translateX(${offset}px) scale(${1.2 - v/200})">♪</div>`;
  },
  'kinestesico-peso': (v) => {
    const drop = (v/100)*8;
    return `<div class="text-2xl transition-all" style="transform:translateY(${drop}px)">${v < 30 ? '☁' : v < 70 ? '◐' : '⬛'}</div>`;
  },
  'kinestesico-intensidad': (v) => {
    const scale = 0.6 + (v/100)*0.6;
    return `<div class="rounded-full bg-coral-500/60 transition-all" style="width:${24*scale}px;height:${24*scale}px"></div>`;
  },
  'kinestesico-temperatura': (v) => {
    const color = v < 50 ? `rgba(99,170,255,${0.4 + v/120})` : `rgba(248,113,113,${0.4 + (v-50)/100})`;
    return `<div class="w-20 h-8 rounded-lg transition-all" style="background:${color}"></div>`;
  },
  'kinestesico-textura': (v) => {
    // Visualiza de suave (blur) a rugoso (patrón puntillado)
    const density = Math.round(v / 20);
    let dots = '';
    for(let i=0; i<density; i++) dots += `<span style="display:inline-block;width:5px;height:5px;border-radius:50%;background:rgba(99,102,241,0.6);margin:1px"></span>`;
    return `<div class="flex flex-wrap items-center justify-center gap-0.5 h-8">${density === 0 ? '<span style="font-size:11px;color:#94a3b8">suave</span>' : dots}</div>`;
  },
};

/* ============================================================
   TRANSFORMACIÓN — STEPPER (una sugerencia a la vez)

function buildSuggestions(){
  const s = [];
  const v = state.visual;
  const a = state.auditivo;
  const k = state.kinestesico;
  // Solo generar sugerencia si el slider se alejó al menos 15 puntos del centro (50)
  const UMBRAL = 15;
  const lejosDel50 = (val) => val !== null && val !== undefined && Math.abs(val - 50) >= UMBRAL;

  // — VISUAL básico —
  if(lejosDel50(v.brillo)){
    if(v.brillo < 50)
      s.push({ mod:'Subí el brillo', side:'V', detail:'Está oscura — hacela más luminosa, encendida, como si le subieras la luz.' });
    else
      s.push({ mod:'Bajá el brillo', side:'V', detail:'Está muy iluminada — hacela más oscura, atenuada, como una lámpara baja.' });
  }
  if(lejosDel50(v.distancia)){
    if(v.distancia < 50)
      s.push({ mod:'Alejá la imagen', side:'V', detail:'Está cerca — llevala al fondo, cada vez más lejos hasta que sea un punto.' });
    else
      s.push({ mod:'Acercá la imagen', side:'V', detail:'Está lejos — traela más cerca, más presente, que la puedas ver bien.' });
  }
  if(lejosDel50(v.tamanio)){
    if(v.tamanio > 50)
      s.push({ mod:'Achicá la imagen', side:'V', detail:'Es grande — reducila hasta que sea pequeña, casi un sello postal.' });
    else
      s.push({ mod:'Agrandá la imagen', side:'V', detail:'Es chica — expandila, que llene toda tu visión interior.' });
  }

  // — VISUAL avanzado (solo si el usuario lo eligió, es decir no es null) —
  if(v.color !== null && v.color !== undefined){
    const opuestoMod  = { 0:'Agregale color',      1:'Sacale el tono sepia', 2:'Intensificá los colores', 3:'Suavizá los colores' };
    const opuestoDet  = {
      0:'Está en blanco y negro — agregale color, hacela más vívida y presente.',
      1:'Tiene tono sepia — sacáselo y hacela más vívida y actual.',
      2:'Está suave — subí la saturación al máximo, que sea más intensa.',
      3:'Está muy vívida — bajá los colores, que sea más suave o blanco y negro.',
    };
    s.push({ mod: opuestoMod[v.color], side:'V', detail: opuestoDet[v.color] });
  }
  if(v.movimiento !== null && v.movimiento !== undefined){
    if(v.movimiento === 'estatica')
      s.push({ mod:'Poné la imagen en movimiento', side:'V', detail:'Está quieta como una foto — animala, que fluya como una película.' });
    else
      s.push({ mod:'Congelá la imagen', side:'V', detail:'Está en movimiento — pausala, convertila en una foto estática.' });
  }
  if(v.asociado !== null && v.asociado !== undefined){
    if(v.asociado === 'asociado')
      s.push({ mod:'Disociarte de la escena', side:'V', detail:'Estás adentro — salí, mirala desde afuera, viéndote a vos mismo en esa imagen.' });
    else
      s.push({ mod:'Meterte dentro de la escena', side:'V', detail:'Estás afuera — entrá, viví la escena con tus propios ojos.' });
  }
  // Nuevas: foco
  if(v.foco !== null && v.foco !== undefined){
    if(v.foco === 'nitida')
      s.push({ mod:'Desenfocá la imagen', side:'V', detail:'Está muy nítida — ponela borrosa, que los detalles se disuelvan. La nitidez le da intensidad; el desenfoque la relaja.' });
    else
      s.push({ mod:'Enfocá la imagen', side:'V', detail:'Está borrosa — subí el foco, que se vea clara y definida.' });
  }
  // Nuevas: marco
  if(v.marco !== null && v.marco !== undefined){
    if(v.marco === 'sin')
      s.push({ mod:'Poné un marco a la imagen', side:'V', detail:'No tiene límites — enmarcala, como si fuera un cuadro o una foto. El marco la contiene y le quita fuerza expansiva.' });
    else
      s.push({ mod:'Sacá el marco', side:'V', detail:'Tiene un borde que la contiene — quitáselo, que se expanda y llene todo.' });
  }
  // Nuevas: velocidad visual (solo si hay movimiento)
  if(v.movimiento === 'movimiento' && v.velocidad !== null && v.velocidad !== undefined){
    if(v.velocidad === 2) // rápida
      s.push({ mod:'Frenala en cámara lenta', side:'V', detail:'Se mueve rápido — reducí la velocidad al mínimo, que sea casi una diapositiva.' });
    else if(v.velocidad === 0) // lenta
      s.push({ mod:'Acelerá la imagen', side:'V', detail:'Se mueve muy lento — acelerala, que sea una película a velocidad normal.' });
  }

  // — AUDITIVO (solo si hay sonido) —
  if(a.hay === 'si'){
    if(lejosDel50(a.volumen)){
      if(a.volumen > 50)
        s.push({ mod:'Bajá el volumen', side:'A', detail:'Está fuerte — bajá ese sonido casi hasta el silencio.' });
      else
        s.push({ mod:'Subí el volumen', side:'A', detail:'Está bajo — subí ese sonido, que se escuche con más presencia.' });
    }
    if(lejosDel50(a.distancia)){
      if(a.distancia < 50)
        s.push({ mod:'Alejá el sonido', side:'A', detail:'Está cerca — empujalo hacia atrás, que suene desde lejos.' });
      else
        s.push({ mod:'Acercá el sonido', side:'A', detail:'Está lejos — traelo más cerca, que resuene desde adentro.' });
    }
    // Avanzado: tono
    if(a.tono !== null && a.tono !== undefined){
      if(a.tono === 2) // agudo
        s.push({ mod:'Bajá el tono del sonido', side:'A', detail:'Es agudo — hacelo más grave, más suave, menos penetrante.' });
      else if(a.tono === 0) // grave
        s.push({ mod:'Subí el tono del sonido', side:'A', detail:'Es grave y pesado — elevá el tono, que sea más liviano y neutral.' });
    }
    // Avanzado: ritmo
    if(a.ritmo === 0) // continuo
      s.push({ mod:'Fragmentá el sonido', side:'A', detail:'Es continuo — interrumpilo, convertilo en algo intermitente, que tenga silencios.' });
    else if(a.ritmo === 1) // intermitente
      s.push({ mod:'Unificá el sonido', side:'A', detail:'Aparece y desaparece — estabilizalo, que sea constante y predecible.' });
    // Avanzado: voz
    if(a.voz === 1) // voz propia
      s.push({ mod:'Cambiá el tono de tu voz interna', side:'A', detail:'Es tu propia voz — escucháte diciendo lo mismo pero con un tono más suave, más tranquilo, como si hablaras con alguien que querés.' });
    else if(a.voz === 2) // voz ajena
      s.push({ mod:'Alejá esa voz y bajá el volumen', side:'A', detail:'Es la voz de otro — empujala lejos, bajá el volumen, hasta que sea un murmullo lejano e inofensivo.' });
    // Nuevas: velocidad auditiva
    if(a.velocidad === 'rapida')
      s.push({ mod:'Frenalo — que suene más lento', side:'A', detail:'Va rápido — reducí la velocidad, que se escuche pausado, con espacio entre las palabras o los sonidos.' });
    else if(a.velocidad === 'lenta')
      s.push({ mod:'Aceleralo levemente', side:'A', detail:'Va muy lento — subí un poco la velocidad, que fluya con más energía y menos peso.' });
    // Nuevas: timbre
    if(a.timbre === 0) // penetrante
      s.push({ mod:'Suavizá el timbre', side:'A', detail:'Es penetrante — convertilo en un susurro suave, que pierda esa fuerza cortante.' });
    // Nuevas: ubicación auditiva
    if(a.ubicacion === 4) // interno
      s.push({ mod:'Externalizá el sonido', side:'A', detail:'Está dentro de tu cabeza — empujalo hacia afuera, que venga de lejos, desde la pared de enfrente.' });
    else if(a.ubicacion === 0 || a.ubicacion === 1) // izquierda o derecha
      s.push({ mod:'Llevá el sonido al frente', side:'A', detail:'Está de costado — movelo hacia adelante, frente a vos, que sea más neutral y menos envolvente.' });
  }

  // — KINESTÉSICO —
  if(lejosDel50(k.peso)){
    if(k.peso > 50)
      s.push({ mod:'Aliviá el peso', side:'K', detail:'Se siente pesado — imagina que esa carga se vuelve más liviana, como si flotara.' });
    else
      s.push({ mod:'Dale más peso', side:'K', detail:'Se siente liviano — dale más presencia, más solidez, que se sienta con más cuerpo.' });
  }
  if(lejosDel50(k.intensidad)){
    if(k.intensidad > 50)
      s.push({ mod:'Bajá la intensidad', side:'K', detail:'Es intensa — reducila, que sea más leve y manejable.' });
    else
      s.push({ mod:'Subí la intensidad', side:'K', detail:'Es débil — amplificala, que se sienta con más fuerza.' });
  }
  if(lejosDel50(k.temperatura)){
    if(k.temperatura > 50)
      s.push({ mod:'Enfriá la sensación', side:'K', detail:'Está caliente — imaginá agua fresca corriendo por esa zona.' });
    else
      s.push({ mod:'Calentá la sensación', side:'K', detail:'Está fría — imaginá calor suave expandiéndose por esa zona.' });
  }
  // Avanzado: textura
  if(k.textura !== null && k.textura !== undefined){
    if(k.textura === 2 || k.textura === 1) // punzante o rugosa
      s.push({ mod:'Suavizá la textura', side:'K', detail:'Se siente áspera o punzante — imaginá que esa superficie se vuelve suave, lisa, como seda.' });
    else if(k.textura === 3) // difusa
      s.push({ mod:'Dale forma a la sensación', side:'K', detail:'Es difusa, sin límites claros — dale un borde, una forma definida. Cuando tiene límites, se puede manejar.' });
  }
  // Avanzado: movimiento kinestésico
  if(k.movimiento === 1){ // en movimiento
    s.push({ mod:'Cambiá la dirección del movimiento', side:'K', detail:'La sensación se mueve — invertí su dirección. Si sube, hacela bajar. Si gira, girala al revés. Este cambio solo suele reducir la intensidad rápido.' });
    if(k.ritmo === 2) // rápido
      s.push({ mod:'Frenala en cámara lenta', side:'K', detail:'Se mueve rápido — reducí la velocidad, que fluya lento como melaza, hasta casi detenerse.' });
  } else if(k.movimiento === 0){ // estática
    s.push({ mod:'Poné la sensación en movimiento', side:'K', detail:'Está fija y estática — imaginá que empieza a moverse suavemente, a fluir, a circular. El movimiento la transforma.' });
  }
  // Nuevas: tensión
  if(k.tension !== null && k.tension !== undefined){
    if(k.tension === 0) // tirante
      s.push({ mod:'Soltá la tensión', side:'K', detail:'Está tirante, contraída — imaginá que esa tensión se suelta despacio, como si alguien aflojara un nudo.' });
    else if(k.tension === 1) // floja
      s.push({ mod:'Dale firmeza a la sensación', side:'K', detail:'Está floja y sin tono — imaginá que le das una estructura leve, que se organiza.' });
  }
  // Nuevas: profundidad
  if(k.profundidad !== null && k.profundidad !== undefined){
    if(k.profundidad === 2 || k.profundidad === 0) // dentro del cuerpo o superficie
      s.push({ mod:'Movela hacia afuera del cuerpo', side:'K', detail:'Está adentro — imaginá que esa sensación sale hacia la superficie y luego se separa de vos, que queda flotando a un metro de distancia.' });
    else if(k.profundidad === 3) // fuera del cuerpo
      s.push({ mod:'Llevala más lejos', side:'K', detail:'Ya está fuera de vos — empujala más lejos, que se aleje, que se disuelva en el aire.' });
  }

  // — Fallback: si el usuario no movió ningún slider significativamente,
  //   ofrecer las 3 sugerencias más universales de PNL —
  if(s.length === 0){
    s.push({ mod:'Alejá la imagen', side:'V', detail:'Llevala al fondo de tu mente, cada vez más lejos, hasta que sea un punto pequeño.' });
    s.push({ mod:'Bajá el brillo', side:'V', detail:'Hacela más oscura y apagada — como si le bajaras la luz lentamente.' });
    s.push({ mod:'Achicá la imagen', side:'V', detail:'Reducila hasta que sea pequeña, casi un sello postal en la distancia.' });
  }

  return s;
}

}

// Exportar historial como texto descargable
function exportHistory(){
  if(!state.sessions.length){ alert('Todavía no hay ejercicios para exportar.'); return; }
  const lines = ['Soltá — Mi historial de ejercicios','='.repeat(40),''];
  state.sessions.forEach((s,i) => {
    lines.push(`Ejercicio ${i+1} — ${s.date}`);
    lines.push(`  Tema: ${s.label}`);
    lines.push(`  Tipo: ${s.category}`);
    lines.push(`  Intensidad antes: ${s.before}/10`);
    lines.push(`  Intensidad después: ${s.after}/10 (bajaste ${s.before-s.after} puntos)`);
    if(s.ancla) lines.push(`  Anclaje: ${s.ancla}`);
    lines.push('');
  });
  const stats = {
    total: state.sessions.length,
    avg: (state.sessions.reduce((a,s) => a+(s.before-s.after), 0) / state.sessions.length).toFixed(1)
  };
  lines.push('—'.repeat(20));
  lines.push(`Total: ${stats.total} ejercicios · Alivio promedio: ${stats.avg} puntos`);
  lines.push('');
  lines.push('Generado por Soltá — soltalo que te pesa.');
  const txt = lines.join('\n');
  const blob = new Blob([txt], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `solta-historial-${new Date().toISOString().slice(0,10)}.txt`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

              </defs>
              <path d="M ${points[0].x} 100 ${points.map(p=>`L ${p.x} ${p.y}`).join(' ')} L ${points[points.length-1].x} 100 Z" fill="url(#grad)"/>
              ${points.map((p,i) => i>0 ? `<line x1="${points[i-1].x}" y1="${points[i-1].y}" x2="${p.x}" y2="${p.y}" stroke="#6366F1" stroke-width="2.5"/>` : '').join('')}
              ${points.map(p => `<circle cx="${p.x}" cy="${p.y}" r="5" fill="#6366F1" stroke="white" stroke-width="2"/>`).join('')}
            </svg>
          ` : `
            <p class="text-sm text-stone-600 py-6 text-center">Hacé un ejercicio más para ver tu gráfico de tendencia.</p>
          `}
          <div class="grid grid-cols-2 gap-2 mt-3 pt-3 border-t border-stone-100">
            <div class="text-center"><div class="text-2xl font-extrabold text-ink">${ss.length}</div><div class="text-[10px] text-stone-600 uppercase">${ss.length===1?'ejercicio':'ejercicios'}</div></div>
            <div class="text-center"><div class="text-2xl font-extrabold text-mint-500">${avgDelta}</div><div class="text-[10px] text-stone-600 uppercase">alivio promedio</div></div>
          </div>
        </div>

        ${(function(){
          // Nube de anclajes (palabras ancladas)
          const anclas = ss.filter(s => s.ancla && s.ancla.trim()).map(s => s.ancla.trim().toLowerCase());
          if(!anclas.length) return '';
          const counts = {};
          anclas.forEach(a => counts[a] = (counts[a]||0)+1);
          const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]);
          return `
            <div class="mx-5 mt-4 bg-mint-50 rounded-2xl p-4 border border-mint-100">
              <div class="text-sm font-semibold text-ink mb-2">⚓ Tus anclajes</div>
              <p class="text-xs text-stone-600 mb-3">Las palabras que elegiste para anclarte después de cada ejercicio:</p>
              <div class="flex flex-wrap gap-2">
                ${sorted.map(([w,c]) => {
                  const size = c >= 3 ? 'text-base' : c >= 2 ? 'text-sm' : 'text-xs';
                  return `<span class="inline-block bg-white border border-mint-200 text-mint-700 px-3 py-1 rounded-full font-medium ${size}">${esc(w)}${c>1?' ·'+c:''}</span>`;
                }).join('')}
              </div>
            </div>
          `;
        })()}

        <div class="mx-5 mt-4">
          <div class="flex items-center justify-between mb-3 px-1">
            <div class="text-sm font-semibold text-ink">Ejercicios recientes</div>
            <div class="flex gap-2">
              <button onclick="exportHistory()" class="text-[11px] text-ind-600 hover:text-ind-700 font-medium underline">
                Exportar
              </button>
              <button onclick="clearHistory()" class="text-[11px] text-coral-500 hover:text-coral-700 font-medium underline">
                Borrar historial
              </button>
            </div>
          </div>
          <div class="space-y-2">
            ${ss.map(s => `
              <div class="bg-white rounded-2xl p-4 border border-stone-100">
                <div class="flex items-start justify-between mb-1">
                  <div class="font-semibold text-sm text-ink">${esc(s.label)}</div>
                  <span class="text-[10px] bg-ind-100 text-ind-700 px-2 py-0.5 rounded-full font-medium">${esc(s.category)}</span>
                </div>
                <div class="text-[11px] text-stone-500">${esc(s.date)}${s.ancla ? ' · ⚓ ' + esc(s.ancla) : ''}</div>
                <div class="flex items-center gap-2 mt-2.5">
                  <span class="text-coral-500 font-bold">${s.before}</span>
                  <div class="flex-1 h-1.5 bg-stone-200 rounded-full overflow-hidden">
                    <div class="h-full bg-gradient-to-r from-coral-500 to-mint-500" style="width:${(s.before-s.after)*10}%"></div>
                  </div>
                  <span class="text-mint-500 font-bold">${s.after}</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `}
      ${DisclaimerFooter()}
    </div>
  `;
}

function render(){
  const map = {
    portada: ScreenPortada,
    home: ScreenHome,
    'sesion-1': ScreenSesion1,
    'sesion-musica': ScreenSesionMusica,
    'sesion-2a': ScreenSesion2a,
    'sesion-2b': ScreenSesion2b,
    'sesion-2c': ScreenSesion2c,
    'sesion-habito': ScreenSesionHabito,
    'sesion-V': ScreenSesionV,
    'sesion-A': ScreenSesionA,
    'sesion-K': ScreenSesionK,
    'sesion-7': ScreenSesion7,
    'sesion-reintegracion': ScreenSesionReintegracion,
    'sesion-cierre-respiro': ScreenCierreRespiro,
    'sesion-cierre-medicion': ScreenCierreMedicion,
    diario: ScreenDiario,
    sobre: ScreenSobre,
    aviso: ScreenAviso,
  };
  document.getElementById('app').innerHTML = (map[state.screen] || ScreenPortada)();
  // Si el audio estaba activo y el contexto quedó suspendido, reactivarlo
  if(Audio432.isPlaying()){
    Audio432.resumeIfSuspended();
  }
  if(!state.screen.startsWith('sesion-')){
    if(timerInterval){ clearInterval(timerInterval); timerInterval = null; }
    if(Audio432.isPlaying()) Audio432.toggle(); // detener música al salir de sesión
  } else {
    startTimerTick();
  }
  window._renderAudioPlayer && window._renderAudioPlayer();
}

let timerInterval = null;
function startTimerTick(){
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(function(){
    var el = document.getElementById('timer');
    if(el) el.textContent = tickTimer();
  }, 1000);
}

if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(err){
      console.warn('SW registration failed:', err);
    });
  });
}

render();
</script>
